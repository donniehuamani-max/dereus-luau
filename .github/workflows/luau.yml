name: Luau validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module files
        run: |
          test -f src/Dereus.lua
          test -f src/Components.lua
          test -f src/Motion.lua
          test -f src/Notify.lua
          test -f src/Window.lua
          test -f src/Style.lua
          test -f src/Layout.lua
          test -f src/init.lua
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          grep -q 'Version = "2.3.0"' src/Dereus.lua
